name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: lukka/get-cmake@v4
        with:
          cmake-version: "3.25.0"
      - name: Configure
        run: |
          mkdir -p build
          cd build
          cmake ..
      - name: Build
        run: |
          cd build
          cmake --build . --config Release
      - name: Run tests
        run: |
          cd build
          ctest --output-on-failure
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ci-cd-cpp-demo-artifact
          path: build/ci_cd_cpp_demo
